services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: yuehe-mysql-dev
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: yuehe
      MYSQL_USER: yuehe
      MYSQL_PASSWORD: yuehe123
    ports:
      - "3316:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
      - ./Dump20200212.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - yuehe-dev-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: yuehe-redis-dev
    ports:
      - "6389:6379"
    volumes:
      - redis_data_dev:/data
    command: redis-server --appendonly yes
    networks:
      - yuehe-dev-network

volumes:
  mysql_data_dev:
  redis_data_dev:

networks:
  yuehe-dev-network:
    driver: bridge
