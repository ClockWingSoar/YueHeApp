name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: value
    attributes:
      label: Value proposition
      description: What problem does this solve and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: ac
    attributes:
      label: Acceptance criteria
      description: List concrete, testable outcomes

