name: Bug report
description: File a bug report
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide clear, numbered steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version/Commit
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      render: shell

