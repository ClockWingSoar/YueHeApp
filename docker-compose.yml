services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: yuehe-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: yuehe
      MYSQL_USER: yuehe
      MYSQL_PASSWORD: yuehe123
    ports:
      - "3316:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./yuehe-prod-20190810.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - yuehe-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: yuehe-redis
    ports:
      - "6389:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - yuehe-network

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: yuehe-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/yuehe?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: yuehe
      SPRING_DATASOURCE_PASSWORD: yuehe123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ""
    ports:
      - "8090:8080"
    depends_on:
      - mysql
      - redis
    networks:
      - yuehe-network
    restart: unless-stopped

  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: yuehe-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8090/api
    ports:
      - "3010:3000"
    depends_on:
      - backend
    networks:
      - yuehe-network
    restart: unless-stopped

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: yuehe-nginx
    ports:
      - "90:80"
      - "453:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - yuehe-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  yuehe-network:
    driver: bridge
